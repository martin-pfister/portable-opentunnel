name: CI

# Every push to main publishes a numbered GitHub Release once format, Clippy,
# dependency, and AlmaLinux acceptance checks pass.
#
# Security posture:
#   - No `pull_request_target`. Pull request code never sees secrets.
#   - Build and test jobs have `contents: read`. Only the main-push publishing
#     job has `contents: write`; it does not check out or run repository code.
#   - Every third-party action is pinned to a commit SHA with the release tag in
#     a comment. Renovate/Dependabot may update the SHA, not a floating tag.
#   - The acceptance container is referenced by manifest digest, never by tag.
#   - No job contacts the hosted OpenTunnel service or needs its credentials.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede stale PR checks, but don't drop queued main pushes.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Must match `channel` in rust-toolchain.toml; a step below enforces that.
  RUST_TOOLCHAIN: "1.89.0"
  MUSL_TARGET: x86_64-unknown-linux-musl
  # Advisory/lint tool versions, pinned like the actions.
  CARGO_DENY_VERSION: "0.21.0"
  CARGO_INCREMENTAL: "0"

jobs:
  quality:
    name: Format, Clippy, lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: ${{ env.MUSL_TARGET }}

      - name: Verify toolchain pin matches rust-toolchain.toml
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml | tr -d '\r')
          if [ "$channel" != "$RUST_TOOLCHAIN" ]; then
            echo "rust-toolchain.toml pins '$channel' but CI pins '$RUST_TOOLCHAIN'" >&2
            exit 1
          fi
          rustc --version
          cargo --version

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: quality
          cache-on-failure: false

      - name: Require a committed lockfile
        run: |
          set -euo pipefail
          git ls-files --error-unmatch Cargo.lock >/dev/null
          cargo metadata --locked --format-version 1 >/dev/null

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy with warnings denied
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  dependencies:
    name: Dependency licenses and advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install cargo-deny
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}

      - name: Check dependency licenses, advisories, bans, sources
        run: cargo deny --all-features --locked check

  acceptance:
    name: AlmaLinux 8.8 acceptance and static build
    # GitHub's runner only orchestrates: it compiles static musl executables,
    # then executes them inside the pinned AlmaLinux 8.8 container. The runner's
    # own userland is never an acceptance target.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Both gates must pass before this job runs. Acceptance is the only job that
    # can upload a release artifact, so depending on `dependencies` as well as
    # `quality` keeps a license/advisory failure from ever producing one.
    needs: [quality, dependencies]
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: ${{ env.MUSL_TARGET }}

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: musl
          cache-on-failure: false

      - name: Install musl C toolchain
        # ring contains C and assembly, so a musl-targeting C compiler is needed
        # even though the final executable is fully static.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools file binutils

      - name: Select the musl linker
        # Makes the linker choice explicit instead of relying on `cc`. The
        # helper writes the variables to $GITHUB_ENV so later steps inherit them.
        run: |
          set -euo pipefail
          . scripts/ci/musl-env.sh
          grep -E '^(CARGO_TARGET_|CC_)' "$GITHUB_ENV" || true

      - name: Build static test executables
        run: |
          set -euo pipefail
          mkdir -p .ci-out
          cargo test --locked --no-run --target "$MUSL_TARGET" \
            --message-format=json > .ci-out/test-messages.json
          python3 scripts/ci/test-manifest.py \
            --require-target "$MUSL_TARGET" \
            .ci-out/test-messages.json > .ci-out/manifest.tsv
          cat .ci-out/manifest.tsv

      - name: Build static release executable
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$MUSL_TARGET"
          ls -l "target/$MUSL_TARGET/release/portable-opentunnel"

      - name: Verify every test executable and the release binary are static
        run: |
          set -euo pipefail
          mapfile -t test_bins < <(cut -f2 .ci-out/manifest.tsv)
          scripts/ci/check-static-elf.sh \
            "target/$MUSL_TARGET/release/portable-opentunnel" \
            "${test_bins[@]}"

      - name: Pull the pinned AlmaLinux 8.8 image
        run: |
          set -euo pipefail
          image=$(scripts/ci/container-ref.sh)
          echo "pinned image: $image"
          docker pull "$image"
          # Fail if the digest was replaced or the platform is not x86-64. A tag
          # would hide both problems.
          scripts/ci/verify-image.sh --runtime docker "$image"

      - name: Run acceptance tests inside AlmaLinux 8.8
        # The workspace is mounted at its own absolute path so paths baked into
        # test binaries resolve inside the container. The repository is
        # read-only; the scratch tree is the only writable host mount.
        #
        # Runs as the host caller's uid/gid, not root. Docker's default root
        # bypasses filesystem permission checks (DAC), so a test that expects
        # `EACCES` cannot exercise that failure path as root or prove how the
        # program behaves for an ordinary user. The image needs no matching user
        # entry because the runner sets HOME and the XDG variables explicitly.
        #
        # `--add-host` supplies the controlled /etc/hosts name the host-target
        # test uses, so no external DNS is involved.
        #
        # `--require-release-exercised` fails the job unless an integration test
        # actually launched the shipped binary, so "help and version run" cannot
        # be mistaken for lifecycle coverage.
        run: |
          set -euo pipefail
          image=$(scripts/ci/container-ref.sh)
          scratch="$RUNNER_TEMP/acceptance-scratch"
          rm -rf "$scratch"
          mkdir -p "$scratch"
          docker run --rm \
            --network none \
            --user "$(id -u):$(id -g)" \
            --add-host portable-opentunnel-fixture:127.0.0.1 \
            -e PORTABLE_OPENTUNNEL_TEST_HOST=portable-opentunnel-fixture \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            -v "$scratch:/scratch:rw" \
            -w "$GITHUB_WORKSPACE" \
            "$image" \
            bash "$GITHUB_WORKSPACE/scripts/ci/run-acceptance.sh" \
              --manifest "$GITHUB_WORKSPACE/.ci-out/manifest.tsv" \
              --binary "$GITHUB_WORKSPACE/target/$MUSL_TARGET/release/portable-opentunnel" \
              --scratch /scratch \
              --require-release-exercised

      - name: Package release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          scripts/ci/package-artifact.sh \
            --binary "target/$MUSL_TARGET/release/portable-opentunnel" \
            --target "$MUSL_TARGET" \
            --outdir .ci-out/dist \
            --version "build-$GITHUB_RUN_NUMBER"

      - name: Upload release artifact
        id: upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-opentunnel-build-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: .ci-out/dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish main build to GitHub Releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    # Publish one at a time so an older build cannot race a newer one for Latest.
    concurrency:
      group: portable-opentunnel-publish-main
      queue: max
    steps:
      - name: Download the accepted package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.acceptance.outputs.artifact-id }}
          # A retry of only this job may use an artifact from an earlier attempt.
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/release

      - name: Publish the numbered release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          tag="build-$GITHUB_RUN_NUMBER"
          stem="portable-opentunnel-$tag-$MUSL_TARGET"
          archive="$stem.tar.gz"
          checksum="$archive.sha256"
          metadata="$stem.metadata.json"
          checksum_line=$(sha256sum "$archive")
          printf '%s\n' "$checksum_line" | cmp - "$checksum"
          jq -e --arg tag "$tag" --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg target "$MUSL_TARGET" --arg archive "$archive" --arg digest "${checksum_line%% *}" \
            '.version == $tag and .commit == $sha and .run_id == $run
             and .target == $target and .archive == $archive
             and .archive_sha256 == $digest and .linked == "static"' \
            "$metadata" >/dev/null

          # Never publish against a pre-existing tag that points elsewhere.
          if ! tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha'); then
            tag_sha=$(gh api "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" --jq '.object.sha')
          fi
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "$tag points to $tag_sha, not the accepted commit $GITHUB_SHA" >&2
            exit 1
          fi

          if draft=$(gh release view "$tag" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" == false ]]; then
              echo "$tag is already published; leaving it unchanged."
              exit 0
            fi
          else
            run_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
            gh release create "$tag" --verify-tag --draft --title "$tag" \
              --notes "Automated build of \`$GITHUB_SHA\`. [CI and acceptance results]($run_url)."
          fi
          # Retry incomplete uploads only on a draft. Published assets are never replaced.
          gh release upload "$tag" --clobber "$archive" "$checksum" "$metadata"

          if ! latest=$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name' 2>&1); then
            if [[ "$latest" != *"(HTTP 404)"* ]]; then
              printf '%s\n' "$latest" >&2
              exit 1
            fi
            latest=
          fi
          make_latest=true
          if [[ "$latest" =~ ^build-([1-9][0-9]*)$ ]] && (( BASH_REMATCH[1] > GITHUB_RUN_NUMBER )); then
            make_latest=false
          fi
          gh release edit "$tag" --draft=false --latest="$make_latest"

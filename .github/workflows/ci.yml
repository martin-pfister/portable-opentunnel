name: CI

# Every push to main publishes a numbered GitHub Release once format, Clippy,
# dependency, and test checks pass. The three checks run in parallel; only the
# release job waits for all of them.
#
# Security posture:
#   - No `pull_request_target`. Pull request code never sees secrets.
#   - Build and test jobs have `contents: read`. Only the main-push publishing
#     job has `contents: write`; it does not check out or run repository code.
#   - Every third-party action is pinned to a commit SHA with the release tag in
#     a comment. Renovate/Dependabot may update the SHA, not a floating tag.
#   - No job contacts the hosted OpenTunnel service or needs its credentials.
#     The test harness sends any non-loopback request to a proxy that refuses it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Supersede stale PR checks, but don't drop queued main pushes.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  MUSL_TARGET: x86_64-unknown-linux-musl
  # Share one ID between the binary, package metadata, and published tag.
  PORTABLE_OPENTUNNEL_BUILD_ID: >-
    ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'
        && format('build-{0}', github.run_number) || 'dev' }}
  # Advisory/lint tool versions, pinned like the actions.
  CARGO_DENY_VERSION: "0.21.0"
  CARGO_INCREMENTAL: "0"

jobs:
  quality:
    name: Format, Clippy, lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install && rustc --version && cargo --version

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: quality
          cache-on-failure: false

      - name: Require a committed lockfile
        run: |
          set -euo pipefail
          git ls-files --error-unmatch Cargo.lock >/dev/null
          cargo metadata --locked --format-version 1 >/dev/null

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy with warnings denied
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  dependencies:
    name: Dependency licenses and advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install && cargo --version

      - name: Install cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}

      - name: Check dependency licenses, advisories, bans, sources
        run: cargo deny --all-features --locked check

  test:
    name: Tests against the static release build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install && rustc --version && cargo --version

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: musl
          cache-on-failure: false

      - name: Install musl C toolchain
        # ring contains C and assembly, so a musl-targeting C compiler is needed
        # even though the final executable is fully static.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools file binutils

      - name: Map a fixture hostname to loopback
        run: echo "127.0.0.1 portable-opentunnel-fixture" | sudo tee -a /etc/hosts

      - name: Build the static release binary and test it
        env:
          PORTABLE_OPENTUNNEL_TEST_HOST: portable-opentunnel-fixture
        run: |
          set -euo pipefail
          scripts/ci/test-static.sh
          actual=$("target/$MUSL_TARGET/release/portable-opentunnel" --version)
          if [[ "$actual" != "portable-opentunnel $PORTABLE_OPENTUNNEL_BUILD_ID" ]]; then
            echo "Unexpected binary version: $actual (expected $PORTABLE_OPENTUNNEL_BUILD_ID)" >&2
            exit 1
          fi

      - name: Package release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          scripts/ci/package-artifact.sh \
            --binary "target/$MUSL_TARGET/release/portable-opentunnel" \
            --target "$MUSL_TARGET" \
            --outdir .ci-out/dist

      - name: Upload release artifact
        id: upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-opentunnel-${{ env.PORTABLE_OPENTUNNEL_BUILD_ID }}-attempt-${{ github.run_attempt }}
          path: .ci-out/dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish main build to GitHub Releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The test job uploads the package without waiting for the other checks, so
    # this job must, or a license or advisory failure could still be published.
    needs: [quality, dependencies, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    # Publish one at a time so an older build cannot race a newer one for Latest.
    concurrency:
      group: portable-opentunnel-publish-main
      queue: max
    steps:
      - name: Download the tested package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.test.outputs.artifact-id }}
          # A retry of only this job may use an artifact from an earlier attempt.
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/release

      - name: Publish the numbered release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release"
          tag="$PORTABLE_OPENTUNNEL_BUILD_ID"
          stem=portable-opentunnel-linux-x86_64
          archive="$stem.tar.gz"
          checksum="$archive.sha256"
          metadata="$stem.metadata.json"
          checksum_line=$(sha256sum "$archive")
          printf '%s\n' "$checksum_line" | cmp - "$checksum"
          jq -e --arg tag "$tag" --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            --arg target "$MUSL_TARGET" --arg archive "$archive" --arg digest "${checksum_line%% *}" \
            '.version == $tag and .commit == $sha and .run_id == $run
             and .target == $target and .archive == $archive
             and .archive_sha256 == $digest and .linked == "static"' \
            "$metadata" >/dev/null

          # Never publish against a pre-existing tag that points elsewhere.
          if ! tag_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha'); then
            tag_sha=$(gh api "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" --jq '.object.sha')
          fi
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "$tag points to $tag_sha, not the accepted commit $GITHUB_SHA" >&2
            exit 1
          fi

          if draft=$(gh release view "$tag" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" == false ]]; then
              echo "$tag is already published; leaving it unchanged."
              exit 0
            fi
          else
            run_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
            gh release create "$tag" --verify-tag --draft --title "$tag" \
              --notes "Automated build of \`$GITHUB_SHA\`. [CI results]($run_url)."
          fi
          # Retry incomplete uploads only on a draft. Metadata stays in the CI artifact.
          gh release upload "$tag" --clobber "$archive" "$checksum"

          if ! latest=$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name' 2>&1); then
            if [[ "$latest" != *"(HTTP 404)"* ]]; then
              printf '%s\n' "$latest" >&2
              exit 1
            fi
            latest=
          fi
          make_latest=true
          if [[ "$latest" =~ ^build-([1-9][0-9]*)$ ]] && (( BASH_REMATCH[1] > GITHUB_RUN_NUMBER )); then
            make_latest=false
          fi
          gh release edit "$tag" --draft=false --latest="$make_latest"
